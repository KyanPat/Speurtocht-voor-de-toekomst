<!DOCTYPE html>

<html lang="nl"><head><meta charset="utf-8"/><meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" name="viewport"/><meta content="mobile_blank" name="shell-type"/><link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet"/><link href="https://fonts.googleapis.com" rel="preconnect"/><link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&amp;family=Plus+Jakarta+Sans:wght@600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/><script src="https://cdn.tailwindcss.com"></script><script id="tailwind-config">tailwind.config = { darkMode: "class", theme: { extend: { colors: { "secondary-fixed-dim": "#d0bcff", "on-primary-fixed-variant": "#005236", "on-secondary-fixed": "#23005c", "tertiary-container": "#ff7886", "error-container": "#ffdad6", "surface-dim": "#e2d8d2", "on-tertiary": "#ffffff", "on-tertiary-fixed-variant": "#92002a", "on-primary": "#ffffff", "surface-container-lowest": "#ffffff", "primary": "#006c49", "error": "#ba1a1a", "on-secondary-container": "#fffbff", "on-primary-fixed": "#002113", "surface-container-high": "#f0e6e0", "tertiary-fixed-dim": "#ffb2b7", "on-background": "#1f1b17", "surface-bright": "#fff8f5", "on-error-container": "#93000a", "inverse-on-surface": "#f9efe8", "primary-fixed-dim": "#4edea3", "primary-fixed": "#6ffbbe", "on-tertiary-fixed": "#40000d", "on-error": "#ffffff", "surface-variant": "#eae1da", "outline-variant": "#bbcabf", "surface": "#fff8f5", "primary-container": "#10b981", "background": "#fff8f5", "on-tertiary-container": "#780021", "surface-container": "#f6ece6", "secondary-fixed": "#e9ddff", "tertiary-fixed": "#ffdadb", "secondary": "#6b38d4", "surface-container-highest": "#eae1da", "on-primary-container": "#00422b", "on-surface-variant": "#3c4a42", "on-secondary-fixed-variant": "#5516be", "inverse-primary": "#4edea3", "inverse-surface": "#342f2b", "on-surface": "#1f1b17", "tertiary": "#bc0b3b", "on-secondary": "#ffffff", "secondary-container": "#8455ef", "surface-tint": "#006c49", "surface-container-low": "#fcf2eb", "outline": "#6c7a71" }, borderRadius: { "DEFAULT": "1rem", "lg": "2rem", "xl": "3rem", "full": "9999px" }, spacing: { "margin": "1.25rem", "space-sm": "0.5rem", "gutter-sm": "0.75rem", "margin-lg": "2rem", "space-xl": "2rem", "space-lg": "1.5rem", "space-xs": "0.25rem", "gutter": "1rem", "space-md": "1rem", "margin-sm": "1rem" }, fontFamily: { "headline-lg-mobile": ["Plus Jakarta Sans"], "headline-lg": ["Plus Jakarta Sans"], "headline-md": ["Plus Jakarta Sans"], "body-sm": ["Inter"], "body-md": ["Inter"], "body-lg": ["Inter"], "label-sm": ["Plus Jakarta Sans"], "display-lg": ["Plus Jakarta Sans"], "label-lg": ["Plus Jakarta Sans"], "title-md": ["Plus Jakarta Sans"], "label-md": ["Plus Jakarta Sans"] }, fontSize: { "headline-lg-mobile": ["24px", { "lineHeight": "32px", "letterSpacing": "-0.015em", "fontWeight": "700" }], "headline-lg": ["28px", { "lineHeight": "36px", "letterSpacing": "-0.02em", "fontWeight": "700" }], "headline-md": ["20px", { "lineHeight": "28px", "letterSpacing": "-0.01em", "fontWeight": "600" }], "body-sm": ["12px", { "lineHeight": "16px", "fontWeight": "400" }], "body-md": ["14px", { "lineHeight": "20px", "fontWeight": "400" }], "body-lg": ["16px", { "lineHeight": "24px", "letterSpacing": "-0.005em", "fontWeight": "400" }], "label-sm": ["11px", { "lineHeight": "14px", "letterSpacing": "0.04em", "fontWeight": "700" }], "display-lg": ["36px", { "lineHeight": "44px", "letterSpacing": "-0.02em", "fontWeight": "700" }], "label-lg": ["14px", { "lineHeight": "20px", "letterSpacing": "0.01em", "fontWeight": "600" }], "title-md": ["17px", { "lineHeight": "24px", "fontWeight": "600" }], "label-md": ["12px", { "lineHeight": "16px", "letterSpacing": "0.02em", "fontWeight": "600" }] } } } };</script><style>@layer base{html,body{width:100vw;margin:0;padding:0;}body{overscroll-behavior:none;}.pb-safe{padding-bottom:env(safe-area-inset-bottom,0px);}.pt-safe{padding-top:env(safe-area-inset-top,0px);}main>:first-child{margin-top:0!important;}main>:last-child{margin-bottom:0!important;}}::-webkit-scrollbar{display:none;}</style><style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head><body class="bg-surface font-body-md text-body-md text-on-surface flex flex-col min-h-screen pt-safe pb-safe"><main class="flex-1 flex flex-col relative w-full bg-surface"><div class="flex flex-col w-full px-margin pb-space-xl">
<!-- Top Dismiss Header / Micro Drag Handle Indicator -->
<div class="flex items-center justify-center pt-space-xs pb-space-sm">
<div class="w-10 h-1 rounded-full bg-surface-container-highest"></div>
</div>
<!-- Main Card Container -->
<div class="flex flex-col items-center w-full bg-surface-container-lowest rounded-lg p-space-lg shadow-sm">
<!-- Item Icon Badge -->
<div class="w-14 h-14 rounded-full bg-surface-container flex items-center justify-center text-primary mb-space-sm shadow-sm">
<span class="material-symbols-outlined text-[28px]" style="font-variation-settings: 'FILL' 1;">key</span>
</div>
<!-- Title & Location Badge -->
<h2 class="font-headline-lg-mobile text-headline-lg-mobile text-on-surface text-center mb-space-xs">
      Autosleutels
    </h2>
<div class="inline-flex items-center gap-1.5 px-space-sm py-0.5 rounded-full bg-surface-container-high text-on-surface-variant mb-space-md">
<span class="material-symbols-outlined text-[14px]">local_parking</span>
<span class="font-label-sm text-label-sm">Parkeerdek Noord • 1 pt</span>
</div>
<!-- Question Prompt -->
<p class="font-body-lg text-body-lg text-on-surface text-center mb-space-md px-space-xs">
      Welk verkeersbord zie je hier op het parkeerdek?
    </p>
<!-- Visual Sign Display (Stop Sign Illustration) -->
<div class="w-full bg-surface-container-low rounded-2xl p-space-md flex flex-col items-center justify-center mb-space-lg">
<div class="relative flex items-center justify-center py-2">
<!-- SVG Octagonal STOP Sign -->
<svg aria-label="Stopbord" class="w-24 h-24 drop-shadow-md" viewbox="0 0 120 120">
<!-- Octagon border & background -->
<polygon fill="#bc0b3b" points="35,5 85,5 115,35 115,85 85,115 35,115 5,85 5,35" stroke="#ffffff" stroke-linejoin="round" stroke-width="4"></polygon>
<!-- Inner faint white ring line for realistic look -->
<polygon fill="none" points="36,9 84,9 111,36 111,84 84,111 36,111 9,84 9,36" stroke="#ffffff" stroke-linejoin="round" stroke-opacity="0.6" stroke-width="1.5"></polygon>
<!-- STOP Typography -->
<text fill="#ffffff" font-family="'Plus Jakarta Sans', sans-serif" font-size="22" font-weight="800" letter-spacing="1" text-anchor="middle" x="60" y="68">STOP</text>
</svg>
</div>
<span class="font-label-md text-label-md text-on-surface-variant mt-1">Kijk goed naar de vorm en letters</span>
</div>
<!-- Multiple Choice Options -->
<div class="w-full flex flex-col gap-space-sm mb-space-lg" id="quiz-options">
<!-- Option 1 -->
<button class="quiz-btn w-full flex items-center justify-between px-space-md py-3.5 rounded-full bg-surface-container text-on-surface font-title-md text-title-md transition-all active:scale-[0.98]" onclick="selectOption(this, true)" type="button">
<span class="flex items-center gap-space-sm">
<span class="w-6 h-6 rounded-full bg-surface-container-highest text-on-surface flex items-center justify-center font-label-sm text-label-sm">A</span>
<span>Stopbord</span>
</span>
<span class="status-icon material-symbols-outlined text-[20px] text-outline-variant opacity-0 transition-opacity">check_circle</span>
</button>
<!-- Option 2 -->
<button class="quiz-btn w-full flex items-center justify-between px-space-md py-3.5 rounded-full bg-surface-container text-on-surface font-title-md text-title-md transition-all active:scale-[0.98]" onclick="selectOption(this, false)" type="button">
<span class="flex items-center gap-space-sm">
<span class="w-6 h-6 rounded-full bg-surface-container-highest text-on-surface flex items-center justify-center font-label-sm text-label-sm">B</span>
<span>Eenrichtingsbord</span>
</span>
<span class="status-icon material-symbols-outlined text-[20px] text-outline-variant opacity-0 transition-opacity">cancel</span>
</button>
<!-- Option 3 -->
<button class="quiz-btn w-full flex items-center justify-between px-space-md py-3.5 rounded-full bg-surface-container text-on-surface font-title-md text-title-md transition-all active:scale-[0.98]" onclick="selectOption(this, false)" type="button">
<span class="flex items-center gap-space-sm">
<span class="w-6 h-6 rounded-full bg-surface-container-highest text-on-surface flex items-center justify-center font-label-sm text-label-sm">C</span>
<span>Erf bord</span>
</span>
<span class="status-icon material-symbols-outlined text-[20px] text-outline-variant opacity-0 transition-opacity">cancel</span>
</button>
</div>
<!-- Video Hint Button -->
<button class="w-full flex items-center justify-center gap-2 py-3 px-space-md rounded-full bg-secondary-fixed text-on-secondary-fixed font-label-lg text-label-lg transition-transform active:scale-[0.98] mb-space-md" type="button">
<span class="material-symbols-outlined text-[18px]">play_circle</span>
<span>Kijk video voor een hint</span>
</button>
<!-- Close Button -->
<button class="py-2.5 px-space-lg rounded-full text-on-surface-variant font-label-lg text-label-lg hover:text-on-surface transition-colors active:opacity-70" type="button">
      ✕ Sluiten
    </button>
</div>
</div>
<script>
  function selectOption(button, isCorrect) {
    const allButtons = document.querySelectorAll('.quiz-btn');
    allButtons.forEach(btn => {
      btn.classList.remove('bg-primary', 'text-on-primary', 'bg-error-container', 'text-on-error-container');
      btn.classList.add('bg-surface-container', 'text-on-surface');
      const icon = btn.querySelector('.status-icon');
      if (icon) {
        icon.classList.add('opacity-0');
        icon.style.fontVariationSettings = "'FILL' 0";
      }
    });

    const statusIcon = button.querySelector('.status-icon');
    if (isCorrect) {
      button.classList.remove('bg-surface-container', 'text-on-surface');
      button.classList.add('bg-primary-container', 'text-on-primary-container');
      if (statusIcon) {
        statusIcon.innerText = 'check_circle';
        statusIcon.classList.remove('opacity-0');
        statusIcon.style.fontVariationSettings = "'FILL' 1";
      }
    } else {
      button.classList.remove('bg-surface-container', 'text-on-surface');
      button.classList.add('bg-error-container', 'text-on-error-container');
      if (statusIcon) {
        statusIcon.innerText = 'cancel';
        statusIcon.classList.remove('opacity-0');
        statusIcon.style.fontVariationSettings = "'FILL' 1";
      }
    }
  }
</script></main></body></html>
