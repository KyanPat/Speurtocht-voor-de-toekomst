<span class="material-symbols-outlined text-[16px]">close</span>

<script>
  function toggleOption(btn, isEssential) {
    const isSelected = btn.classList.contains('bg-primary/10');
    const icon = btn.querySelector('.check-icon');
    if (isSelected) {
      btn.classList.remove('bg-primary/10', 'text-on-primary-container');
      btn.classList.add('bg-surface-container', 'text-on-surface-variant');
      if (icon) {
        icon.innerText = 'radio_button_unchecked';
        icon.style.fontVariationSettings = "'FILL' 0";
      }
    } else {
      btn.classList.add('bg-primary/10', 'text-on-primary-container');
      btn.classList.remove('bg-surface-container', 'text-on-surface-variant');
      if (icon) {
        icon.innerText = 'check_circle';
        icon.style.fontVariationSettings = "'FILL' 1";
      }
    }
  }

  function toggleDismiss(btn) {
    const isDismissed = btn.classList.contains('line-through');
    const stateIcon = btn.querySelector('.state-icon');
    if (isDismissed) {
      btn.classList.remove('line-through', 'opacity-70', 'bg-surface-container-high/60', 'text-outline');
      btn.classList.add('bg-surface-container', 'text-on-surface');
      if (stateIcon) {
        stateIcon.innerText = 'add';
        stateIcon.classList.remove('text-tertiary');
        stateIcon.classList.add('text-on-surface-variant');
      }
    } else {
      btn.classList.add('line-through', 'opacity-70', 'bg-surface-container-high/60', 'text-outline');
      btn.classList.remove('bg-surface-container', 'text-on-surface');
      if (stateIcon) {
        stateIcon.innerText = 'close';
        stateIcon.classList.add('text-tertiary');
        stateIcon.classList.remove('text-on-surface-variant');
      }
    }
  }

  function handleConfirmation() {
    const btn = document.getElementById('confirm-btn');
    btn.innerHTML = '<span class="material-symbols-outlined text-[22px]">task_alt</span> <span>Voltooid! +1 Punt</span>';
    btn.classList.remove('bg-primary');
    btn.classList.add('bg-primary-container', 'text-on-primary-container');
    setTimeout(() => {
      // Mock navigation feedback
      btn.classList.add('opacity-90');
    }, 1200);
  }

  function playHintVideo() {
    alert('Hint: Een thuis biedt bescherming tegen het weer en basisvoorzieningen voor hygiëne en rust.');
  }

  function closeTask() {
    history.back();
  }
</script></main>
