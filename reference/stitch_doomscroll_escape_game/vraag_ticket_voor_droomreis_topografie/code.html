<!DOCTYPE html>

<html lang="nl"><head><meta charset="utf-8"/><meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" name="viewport"/><meta content="mobile_blank" name="shell-type"/><link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet"/><link href="https://fonts.googleapis.com" rel="preconnect"/><link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&amp;family=Plus+Jakarta+Sans:wght@600;700&amp;display=swap" rel="stylesheet"/>

: "1rem", "margin-sm": "1rem" }, fontFamily: { "headline-lg-mobile": ["Plus Jakarta Sans"], "headline-lg": ["Plus Jakarta Sans"], "headline-md": ["Plus Jakarta Sans"], "body-sm": ["Inter"], "body-md": ["Inter"], "body-lg": ["Inter"], "label-sm": ["Plus Jakarta Sans"], "display-lg": ["Plus Jakarta Sans"], "label-lg": ["Plus Jakarta Sans"], "title-md": ["Plus Jakarta Sans"], "label-md": ["Plus Jakarta Sans"] }, fontSize: { "headline-lg-mobile": ["24px", { "lineHeight": "32px", "letterSpacing": "-0.015em", "fontWeight": "700" }], "headline-lg": ["28px", { "lineHeight": "36px", "letterSpacing": "-0.02em", "fontWeight": "700" }], "headline-md": ["20px", { "lineHeight": "28px", "letterSpacing": "-0.01em", "fontWeight": "600" }], "body-sm": ["12px", { "lineHeight": "16px", "fontWeight": "400" }], "body-md": ["14px", { "lineHeight": "20px", "fontWeight": "400" }], "body-lg": ["16px", { "lineHeight": "24px", "letterSpacing": "-0.005em", "fontWeight": "400" }], "label-sm": ["11px", { "lineHeight": "14px", "letterSpacing": "0.04em", "fontWeight": "700" }], "display-lg": ["36px", { "lineHeight": "44px", "letterSpacing": "-0.02em", "fontWeight": "700" }], "label-lg": ["14px", { "lineHeight": "20px", "letterSpacing": "0.01em", "fontWeight": "600" }], "title-md": ["17px", { "lineHeight": "24px", "fontWeight": "600" }], "label-md": ["12px", { "lineHeight": "16px", "letterSpacing": "0.02em", "fontWeight": "600" }] } } } };</script><style>@layer base{html,body{width:100vw;margin:0;padding:0;}body{overscroll-behavior:none;}.pb-safe{padding-bottom:env(safe-area-inset-bottom,0px);}.pt-safe{padding-top:env(safe-area-inset-top,0px);}main>:first-child{margin-top:0!important;}main>:last-child{margin-bottom:0!important;}}::-webkit-scrollbar{display:none;}</style><style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head><body class="bg-surface font-body-md text-body-md text-on-surface flex flex-col min-h-screen pt-safe pb-safe"><main class="flex-1 flex flex-col relative w-full bg-surface"><div class="flex flex-col w-full px-margin pb-space-xl">
<!-- Top Bar / Mission Metadata Tag -->
<div class="flex items-center justify-between pt-space-xs pb-space-sm">
<div class="inline-flex items-center gap-1.5 px-3 py-1 rounded-full bg-secondary-fixed text-on-secondary-fixed font-label-sm text-label-sm">
<span class="material-symbols-outlined text-[15px]" style="font-variation-settings: 'FILL' 1;">stars</span>
<span>1 PUNT</span>
</div>
<div class="inline-flex items-center gap-1 px-2.5 py-1 rounded-full bg-surface-container text-on-surface-variant font-label-sm text-label-sm">
<span>ALGEMEEN ITEM</span>
</div>
</div>
<!-- Primary Discovery Card -->
<div class="w-full bg-surface-container-lowest rounded-lg shadow-sm p-space-lg flex flex-col items-center text-center mt-space-xs">
<!-- Tactile Icon Badge -->
<div class="relative flex items-center justify-center w-20 h-20 rounded-lg bg-surface-container-low mb-space-md">
<div class="absolute inset-0 rounded-lg bg-gradient-to-b from-primary/10 to-transparent"></div>
<div class="w-14 h-14 rounded-full bg-surface-bright flex items-center justify-center shadow-sm">
<span class="material-symbols-outlined text-primary text-[32px]" style="font-variation-settings: 'FILL' 1;">confirmation_number</span>
</div>
</div>
<!-- Title & Location -->
<h1 class="font-headline-lg-mobile text-headline-lg-mobile text-on-surface tracking-tight mb-space-xs">
      Ticket voor droomreis
    </h1>
<div class="inline-flex items-center gap-1 text-on-surface-variant font-label-md text-label-md px-3 py-1 rounded-full bg-surface-container mb-space-lg">
<span class="material-symbols-outlined text-[16px] text-primary" style="font-variation-settings: 'FILL' 1;">pin_drop</span>
<span>Receptie LA225</span>
</div>
<!-- Task Question Container -->
<div class="w-full bg-surface-container-low rounded-DEFAULT p-space-md flex flex-col text-left mb-space-md">
<div class="flex items-center gap-1.5 mb-1.5">
<span class="material-symbols-outlined text-primary text-[18px]">explore</span>
<span class="font-label-sm text-label-sm text-primary uppercase tracking-wider">Topografie vraag</span>
</div>
<p class="font-title-md text-title-md text-on-surface">
        In welk land staat de Eiffeltoren?
      </p>
</div>
<!-- Interactive Multiple Choice Options -->
<div class="w-full flex flex-col gap-gutter-sm mb-space-lg" id="quiz-options">
<!-- Option 1 -->
<button class="quiz-btn group w-full flex items-center justify-between p-space-md rounded-DEFAULT bg-surface-container text-on-surface font-title-md text-title-md transition-all duration-200 active:scale-[0.98]" onclick="selectAnswer(this, false)" type="button">
<div class="flex items-center gap-3">
<span class="w-8 h-8 rounded-full bg-surface flex items-center justify-center font-label-md text-label-md text-on-surface-variant shadow-sm option-letter">A</span>
<span>Nederland</span>
</div>
<span class="material-symbols-outlined text-on-surface-variant opacity-40 group-active:opacity-100 option-icon">radio_button_unchecked</span>
</button>
<!-- Option 2 -->
<button class="quiz-btn group w-full flex items-center justify-between p-space-md rounded-DEFAULT bg-surface-container text-on-surface font-title-md text-title-md transition-all duration-200 active:scale-[0.98]" onclick="selectAnswer(this, false)" type="button">
<div class="flex items-center gap-3">
<span class="w-8 h-8 rounded-full bg-surface flex items-center justify-center font-label-md text-label-md text-on-surface-variant shadow-sm option-letter">B</span>
<span>België</span>
</div>
<span class="material-symbols-outlined text-on-surface-variant opacity-40 group-active:opacity-100 option-icon">radio_button_unchecked</span>
</button>
<!-- Option 3 (Correct Answer) -->
<button class="quiz-btn group w-full flex items-center justify-between p-space-md rounded-DEFAULT bg-surface-container text-on-surface font-title-md text-title-md transition-all duration-200 active:scale-[0.98]" onclick="selectAnswer(this, true)" type="button">
<div class="flex items-center gap-3">
<span class="w-8 h-8 rounded-full bg-surface flex items-center justify-center font-label-md text-label-md text-on-surface-variant shadow-sm option-letter">C</span>
<span>Frankrijk</span>
</div>
<span class="material-symbols-outlined text-on-surface-variant opacity-40 group-active:opacity-100 option-icon">radio_button_unchecked</span>
</button>
</div>
<!-- Feedback Message Pill -->
<div class="hidden w-full p-space-sm rounded-DEFAULT mb-space-md font-label-md text-label-md items-center justify-center gap-2" id="feedback-banner"></div>
<!-- Hint Button (Video) -->
<button class="w-full flex items-center justify-center gap-2 py-3 px-space-md rounded-full bg-secondary-fixed text-on-secondary-fixed font-label-lg text-label-lg transition-transform duration-150 active:scale-[0.98]" onclick="toggleHintVideo()" type="button">
<span class="material-symbols-outlined text-[20px]" style="font-variation-settings: 'FILL' 1;">play_circle</span>
<span>Kijk video voor een hint</span>
</button>
<!-- Collapsible Video Drawer -->
<div class="hidden w-full flex-col mt-space-md pt-space-md" id="hint-drawer">
<div class="relative w-full h-44 rounded-DEFAULT bg-surface-container overflow-hidden shadow-inner flex flex-col items-center justify-center">
<div class="w-full h-full bg-cover bg-center flex items-center justify-center" data-alt="A warm cinematic photography view of Parisian streets in morning sunlight with a subtle silhouette of the Eiffel Tower in the misty background, soft pastel earthy tones, travel wanderlust mood" style="background-image: url('https://lh3.googleusercontent.com/aida-public/AB6AXuByZatf2drkay19UxrNj4lxcvHGKxf3bSxMhvS-Bb3d8w5vPTyQeJcF5l-x_BbETjaGRb5zPfeu3pdL_wxRYKvT11qXLakvJD8omY9TWAwhufZltoP55icJOVk5LyqCuupH99ydMuSjx_TYdK0A7FdJiy7wWiLbirq0i0uUQLPRWN0R1XQ9vQnoWn4-WrK5hS2FVMuQOFrBArZhoGbn5x7hgQ6mTbtkbx44I6MSb-0')">
<div class="w-12 h-12 rounded-full bg-surface-bright/90 backdrop-blur-md flex items-center justify-center shadow-md">
<span class="material-symbols-outlined text-primary text-[28px]" style="font-variation-settings: 'FILL' 1;">play_arrow</span>
</div>
</div>
<span class="absolute bottom-2 right-2 px-2 py-0.5 rounded bg-on-background/70 text-surface-bright font-label-sm text-label-sm">0:45</span>
</div>
<p class="font-body-sm text-body-sm text-on-surface-variant mt-2 text-center">
        Hint: Deze historische toren werd gebouwd voor de Wereldtentoonstelling van 1889 in Parijs.
      </p>
</div>
</div>
<!-- Foot Close Action -->
<div class="w-full flex justify-center mt-space-lg mb-space-sm">
<button class="inline-flex items-center gap-1.5 py-2.5 px-6 rounded-full bg-surface-container text-on-surface font-label-lg text-label-lg shadow-sm transition-all duration-150 active:scale-95 active:bg-surface-container-high" type="button">
<span class="material-symbols-outlined text-[18px]">close</span>
<span>Sluiten</span>
</button>
</div>
</div>
<script>
  function selectAnswer(button, isCorrect) {
    const allButtons = document.querySelectorAll('.quiz-btn');
    const feedback = document.getElementById('feedback-banner');
    
    allButtons.forEach(btn => {
      btn.className = "quiz-btn group w-full flex items-center justify-between p-space-md rounded-DEFAULT bg-surface-container text-on-surface font-title-md text-title-md transition-all duration-200 active:scale-[0.98]";
      const icon = btn.querySelector('.option-icon');
      if (icon) {
        icon.innerText = "radio_button_unchecked";
        icon.className = "material-symbols-outlined text-on-surface-variant opacity-40 group-active:opacity-100 option-icon";
      }
    });

    feedback.classList.remove('hidden', 'flex');
    feedback.classList.add('flex');

    if (isCorrect) {
      button.className = "quiz-btn group w-full flex items-center justify-between p-space-md rounded-DEFAULT bg-primary text-on-primary font-title-md text-title-md shadow-md transition-all duration-200";
      const icon = button.querySelector('.option-icon');
      if (icon) {
        icon.innerText = "check_circle";
        icon.className = "material-symbols-outlined text-on-primary option-icon";
      }
      feedback.className = "flex w-full p-space-sm rounded-DEFAULT mb-space-md font-label-md text-label-md items-center justify-center gap-2 bg-primary-container text-on-primary-container";
      feedback.innerHTML = "<span class=\"material-symbols-outlined text-[18px]\">verified</span> Uitstekend! Frankrijk is het juiste antwoord (+1 punt)";
    } else {
      button.className = "quiz-btn group w-full flex items-center justify-between p-space-md rounded-DEFAULT bg-error-container text-on-error-container font-title-md text-title-md transition-all duration-200";
      const icon = button.querySelector('.option-icon');
      if (icon) {
        icon.innerText = "cancel";
        icon.className = "material-symbols-outlined text-on-error-container option-icon";
      }
      feedback.className = "flex w-full p-space-sm rounded-DEFAULT mb-space-md font-label-md text-label-md items-center justify-center gap-2 bg-surface-container text-error";
      feedback.innerHTML = "<span class=\"material-symbols-outlined text-[18px]\">info</span> Nog niet helemaal juist. Probeer de video hint!";
    }
  }

  function toggleHintVideo() {
    const drawer = document.getElementById('hint-drawer');
    if (drawer.classList.contains('hidden')) {
      drawer.classList.remove('hidden');
      drawer.classList.add('flex');
    } else {
      drawer.classList.remove('flex');
      drawer.classList.add('hidden');
    }
  }
</script></main></body></html>
